<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuarios</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div id="main-container">
        <h1>Cadastre-se para acessar o atlas</h1>
        <form id="Register-form">
            <div class="full-box">
                <label for="email"> E-mail</label>
                <input type="email" name="E-mail" id="email" placeholder="Digite seu E-mail" data-min-length="2" data-email-validate>
            </div>
            <div class="half-box spacing">
                <label for="name">Nome</label>
                <input type="text" name="Nome" id="name" placeholder="Digite seu nome" data-required data-min-length="3" data-max-length="16">
            </div>
            <div class="half-box">
                <label for="last-name">Sobrenome</label>
                <input type="text" name="last-name" id="last-name" placeholder="Digite seu Sobrenome" data-required data-only-letters>
            </div>
            <div class="half-box spacing">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Digite sua Senha" data-password-validate data-required>
            </div>
            <div class="half-box">
                <label for="passconfirmation">Senha</label>
                <input type="password" name="passconfirmation" id="passconfirmation" placeholder="Confirme sua Senha" data-equal="password">
            </div>
            <div class="full-box">
                <input type="checkbox" name="agreement" id="agreement" > 
                <label for="agreement" id="agreement-label"> Eu li e aceito os <a herf="#"> termos de uso</a></label>
            </div>
            <div class="full-box">
                <input type="submit" id="btn-submit" value="Registrar" herf=""> 
               
                </div>
        </form>
    </div>
    <p class="error-validation tamplate"></p>
    <script src="../js/login.js"></script>
</body>
</html>
